<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#141416">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GFV Chefia">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="icon-chefia.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23141416'/%3E%3Cpath d='M16 46V30M28 46V20M40 46V34M52 46V14' stroke='%23E30613' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
<title>CICLO GFV Chefia</title>
<style>
/* VOICE the manager's live board: dense, calm, read at a glance between tasks on the shop floor
   IDEA the back-office results board of the store, now live: who registered, how each GFV is doing against the 2-hour targets
   PICTURE today's team board: big count of cycles registered, team tiles in traffic-light colours, then one card per GFV
   COLOUR near-black header (chefia) with the store red as accent, iOS grouped grey ground, white cards; green/amber/red only for results
   TYPE system font (SF Pro on iPhone): 800 figures with negative tracking, 400-600 text
   LAYOUT one column up to 760px (tables need room); sticky header; translucent tab bar; person detail in a bottom sheet */
:root{color-scheme:light dark;--bg:light-dark(#f2f2f7,#000);--card:light-dark(#fff,#1c1c1e);--ink:light-dark(#111114,#f5f5f7);--mut:light-dark(#6b6b73,#98989f);--line:light-dark(rgba(60,60,67,.14),rgba(235,235,245,.12));--fieldline:light-dark(rgba(60,60,67,.22),rgba(235,235,245,.2));--red:#E30613;--head:#141416;
--s1:light-dark(rgba(0,0,0,.05),rgba(255,255,255,.07));--s2:light-dark(rgba(0,0,0,.05),rgba(0,0,0,.4));--s3:light-dark(rgba(0,0,0,.04),rgba(0,0,0,.3));--shadow:0 0 0 1px var(--s1),0 1px 2px var(--s2),0 4px 12px var(--s3);
--g:light-dark(#15803d,#4ade80);--gb:light-dark(#dcfce7,#0f2e1b);--y:light-dark(#a15c07,#fbbf24);--yb:light-dark(#fef3c7,#352a0a);--r:light-dark(#c01818,#ff6b6b);--rb:light-dark(#fee2e2,#3a1214);
--ease-out:cubic-bezier(.23,1,.32,1);--ease-in-out:cubic-bezier(.77,0,.175,1);--ease-drawer:cubic-bezier(.32,.72,0,1)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none;height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;overflow-x:clip;overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{font-size:16px}
button,a,[role=button]{touch-action:manipulation}
button,.tab,.chip,.seg{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.top{position:sticky;top:0;z-index:5;background:var(--head);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.top .in{max-width:760px;margin:auto;display:flex;align-items:center;gap:10px}
.top h1{font-size:20px;font-weight:800;margin:0;letter-spacing:.01em;flex:1;display:flex;align-items:center;gap:8px}
.top h1 i{width:10px;height:10px;border-radius:3px;background:var(--red);flex:none}
.top h1 span{font-weight:600;opacity:.7}
.rf{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:99px;padding:0 14px;font-weight:600;font-size:15px;min-height:36px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;transition:transform 160ms var(--ease-out)}
.rf[hidden]{display:none}
.rf svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.rf.spin svg{animation:spin 700ms linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
main{max-width:760px;margin:auto;padding:14px max(16px,env(safe-area-inset-left,0px)) calc(100px + env(safe-area-inset-bottom,0px))}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.banner{background:var(--yb);color:var(--y);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-weight:600;font-size:15px}
.banner.err{background:var(--rb);color:var(--r)}
.btn{position:relative;overflow:hidden;border:0;border-radius:14px;min-height:50px;padding:0 18px;font-weight:700;font-size:17px;cursor:pointer;background:var(--ink);color:var(--bg);transition:transform 160ms var(--ease-out)}
.btn.sec{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.btn.red{background:var(--red);color:#fff}
.btn.sm{min-height:38px;padding:0 14px;border-radius:12px;font-size:15px}
.btn[disabled]{opacity:.55}
.btn:active,.rf:active,.pcard:active,.tab:active{transform:scale(.97)}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,.tab:focus-visible,.seg button:focus-visible,.pcard:focus-visible,.rf:focus-visible,th button:focus-visible,tr.row:focus-visible{outline:3px solid color-mix(in srgb,var(--red) 55%,transparent);outline-offset:2px}
.day{font-weight:600;color:var(--mut);margin:2px 0 4px;font-size:15px}
.upd{font-size:13px;color:var(--mut);margin:0 0 12px;font-weight:500}
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;align-items:center}
.big{font-size:clamp(56px,17vw,76px);font-weight:800;line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.score p{margin:0;color:var(--mut);font-weight:500;font-size:15px}
.score p b{display:block;color:var(--ink);font-size:19px;font-weight:700;letter-spacing:-.01em}
.tiles{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.tile{border-radius:12px;padding:9px 10px;background:color-mix(in srgb,var(--mut) 12%,transparent)}
.tile b{display:block;font-size:13px;font-weight:600;opacity:.85;letter-spacing:.01em}
.tile strong{font-size:20px;font-weight:800;white-space:nowrap;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bom{background:var(--gb);color:var(--g)}.meio{background:var(--yb);color:var(--y)}.mau{background:var(--rb);color:var(--r)}
.verdict{grid-column:1/-1;margin-top:12px;display:grid;gap:4px;font-size:15px}
.verdict div{display:flex;gap:8px}.verdict i{font-style:normal;font-weight:700;flex:none;width:6.6em}
.tg{color:var(--g)}.ty{color:var(--y)}.tr{color:var(--r)}
h2{font-size:30px;font-weight:800;letter-spacing:-.025em;line-height:1.05;margin:6px 0 12px}
h3.sec{font-size:13px;font-weight:600;color:var(--mut);margin:18px 4px 8px;letter-spacing:.01em}
h3.t{margin:0 0 4px;font-size:18px;font-weight:700}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:8px}
.pcard{display:block;width:100%;text-align:left;background:var(--card);border:0;border-radius:16px;padding:12px 14px;cursor:pointer;box-shadow:var(--shadow);transition:transform 160ms var(--ease-out)}
.pcard .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.pcard .h b{font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .h span{color:var(--mut);font-weight:600;white-space:nowrap;font-size:14px;font-variant-numeric:tabular-nums}
.pcard.none{opacity:.6;cursor:default}
.pcard.none .h{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:8px;padding:4px 8px;font-size:14px;font-weight:700;white-space:nowrap;background:color-mix(in srgb,var(--mut) 12%,transparent);font-variant-numeric:tabular-nums}
.chip em{font-style:normal;font-weight:500;opacity:.8;margin-right:4px}
.seg{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:color-mix(in srgb,var(--mut) 16%,transparent);border-radius:10px;padding:2px;margin-bottom:12px}
.seg i{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px)/4);background:var(--card);border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);transition:transform 250ms var(--ease-in-out)}
.seg button{position:relative;border:0;background:none;min-height:34px;font-size:14px;font-weight:600;cursor:pointer;border-radius:8px;white-space:nowrap}
.range{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-bottom:12px}
.scroll{overflow-x:auto;overscroll-behavior-x:contain}
table{width:100%;border-collapse:separate;border-spacing:0 4px;font-size:14px}
th{font-size:12px;color:var(--mut);font-weight:600;text-align:right;padding:0;letter-spacing:.01em;white-space:nowrap}
th button{border:0;background:none;color:inherit;font:inherit;padding:6px 4px;cursor:pointer;border-radius:6px}
th button[aria-sort]{color:var(--ink)}
th:first-child,td:first-child{text-align:left}
td{padding:8px 4px;text-align:right;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
td.c{border-radius:8px}
td.nm{max-width:8.5em;overflow:hidden;text-overflow:ellipsis;font-weight:600}
td small{display:block;font-weight:500;color:var(--mut);font-size:12px}
tr.row{cursor:pointer}
tr.team td{border-bottom:.5px solid var(--line)}
tr.team td:first-child{font-weight:800}
.actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.note{font-size:13px;color:var(--mut);margin:8px 0 0}
.set{display:grid;gap:12px}
.set label{display:grid;gap:5px;font-weight:600;font-size:15px}
.field{width:100%;border:1px solid var(--fieldline);border-radius:12px;background:var(--card);padding:0 14px;font-size:17px;font-weight:600;height:48px}
textarea.field{height:180px;padding:10px 14px;font-size:16px;line-height:1.5}
.chk{display:flex !important;align-items:center;gap:10px;font-weight:500 !important}
.chk input{width:22px;height:22px;accent-color:var(--red)}
.mt{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.mt .h{font-size:13px;color:var(--mut);font-weight:600}
.mt .field{height:44px;text-align:center;padding:0 6px}
.login{max-width:420px;margin:8vh auto 0}
.login h2{font-size:34px}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-top:.5px solid var(--line)}
.rrow b{font-weight:600}.rrow .v{font-weight:800;font-size:18px;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.rrow .pill{font-size:13px;font-weight:700;border-radius:99px;padding:4px 10px;white-space:nowrap}
.rrow small{display:block;color:var(--mut);font-size:13px;font-weight:500}
.cyc{padding:10px 0;border-top:.5px solid var(--line)}
.cyc .h{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px;font-size:15px}
.cyc .h span{color:var(--mut);font-weight:600;font-size:14px}
.seg.s3{grid-template-columns:repeat(3,minmax(0,1fr))}.seg.s3 i{width:calc((100% - 4px)/3)}
.ins{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:8px;margin-bottom:4px}
.box{border-radius:14px;padding:12px 14px;background:color-mix(in srgb,var(--mut) 9%,transparent)}
.box.g{background:var(--gb)}.box.r{background:var(--rb)}
.box h4{margin:0 0 6px;font-size:15px;font-weight:700}.box h4 small{font-weight:500;color:var(--mut);font-size:13px}
.box.g h4{color:var(--g)}.box.r h4{color:var(--r)}
.box ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:15px}
.box li b{font-weight:700}
.irow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-top:.5px solid var(--line);align-items:center}
.irow b{font-weight:600}.irow small{display:block;color:var(--mut);font-size:13px;font-weight:500}
.irow .v{background:none;font-weight:800;font-size:20px;white-space:nowrap;font-variant-numeric:tabular-nums}
.irow .v.bom{color:var(--g)}.irow .v.meio{color:var(--y)}.irow .v.mau{color:var(--r)}
.spark{grid-column:1/-1;width:100%;height:30px;margin-top:4px;overflow:visible}
.spark polyline{fill:none;stroke:var(--ink);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.spark .ob{stroke:var(--g);stroke-width:1;stroke-dasharray:4 4;vector-effect:non-scaling-stroke}
.mini{border:0;background:color-mix(in srgb,var(--r) 12%,transparent);color:var(--r);font-weight:700;font-size:13px;border-radius:8px;min-height:30px;padding:0 10px;cursor:pointer;transition:transform 160ms var(--ease-out),background-color 150ms ease,color 150ms ease}
.mini.armed{background:var(--r);color:#fff}
.mini:active{transform:scale(.96)}
.cyc .h{align-items:center;gap:8px}
.danger{margin-top:22px;padding:14px;border-radius:14px;background:var(--rb)}
.danger h4{margin:0 0 4px;color:var(--r);font-size:15px}
.danger p{margin:0 0 10px;font-size:14px;color:var(--r)}
.hold{width:100%;background:var(--card);color:var(--r)}
.hold .fill{position:absolute;inset:0;display:grid;place-items:center;background:var(--r);color:#fff;clip-path:inset(0 100% 0 0);transition:clip-path 200ms var(--ease-out);pointer-events:none}
.hold.holding .fill{clip-path:inset(0 0 0 0);transition:clip-path 2000ms linear}
.more{width:100%;margin-top:10px}
.kb{position:fixed;left:0;right:0;top:0;z-index:40;display:none;align-items:center;gap:2px;padding:4px 8px;background:light-dark(rgba(246,246,248,.97),rgba(36,36,38,.97));-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 -.5px 0 var(--line)}
.kb.on{display:flex}
.kb button{border:0;background:none;color:var(--red);font-weight:600;font-size:17px;min-width:44px;min-height:40px;padding:0 10px;cursor:pointer;border-radius:10px}
.kb button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.kb button[disabled]{opacity:.35}
.kb .ok{margin-left:auto;font-weight:700;background:var(--red);color:#fff;min-width:64px}
.dayh{font-size:13px;font-weight:600;color:var(--mut);margin:14px 0 2px;text-transform:capitalize}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:light-dark(rgba(249,249,249,.78),rgba(22,22,24,.78));-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:0 -.5px 0 var(--line);padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px))}
.tabs .in{max-width:560px;margin:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.tab{border:0;background:none;display:grid;justify-items:center;gap:1px;font-size:11px;font-weight:600;color:var(--mut);min-height:50px;cursor:pointer;padding:5px 0 2px;letter-spacing:.01em;transition:transform 160ms var(--ease-out)}
.tab svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current=page]{color:var(--red)}
.tabs[hidden]{display:none}
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);opacity:0;transition:opacity 500ms var(--ease-drawer);pointer-events:none}
.scrim.on{pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;margin:auto;max-width:620px;max-height:calc(var(--vvh,100dvh) - env(safe-area-inset-top,0px) - 24px);display:flex;flex-direction:column;background:var(--card);border-radius:18px 18px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.18);transform:translateY(110%);transition:transform 500ms var(--ease-drawer)}
.sheet.open{transform:translateY(0)}
.sheet[hidden]{display:none}
.grab{flex:none;padding:8px 16px 0;touch-action:none;cursor:grab}
.grab .bar{width:36px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--mut) 40%,transparent);margin:0 auto 10px}
.grab .hd{padding-bottom:8px}
.grab h2{margin:0;font-size:24px;overflow-wrap:anywhere}
.grab .hd p{margin:2px 0 0;color:var(--mut);font-weight:600;font-size:15px}
.sbody{overflow-y:auto;overscroll-behavior:contain;padding:0 16px calc(16px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;transform:translate(-50%,calc(100% + 90px));background:light-dark(#1c1c1e,#f5f5f7);color:light-dark(#fff,#111);padding:11px 16px;border-radius:14px;font-weight:600;font-size:15px;opacity:0;transition:transform 400ms ease,opacity 400ms ease;pointer-events:none;max-width:calc(100vw - 32px);text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{color:var(--mut);text-align:center;padding:20px 8px;margin:0}
@media(hover:hover) and (pointer:fine){.btn:hover{filter:brightness(1.06)}.pcard:not(.none):hover{box-shadow:var(--shadow),0 0 0 2px color-mix(in srgb,var(--mut) 20%,transparent)}tr.row:hover td{background-color:color-mix(in srgb,var(--mut) 8%,transparent)}}
@media(prefers-reduced-motion:reduce){.sheet{transform:none;opacity:0;transition:opacity 200ms ease}.sheet.open{opacity:1}.seg i{transition:none}.toast{transform:translate(-50%,0);transition:opacity 200ms ease}.rf.spin svg{animation:none}}
@media(prefers-reduced-transparency:reduce){.tabs{background:var(--card);-webkit-backdrop-filter:none;backdrop-filter:none}}
@media(max-width:380px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}table{font-size:13px}td.nm{max-width:6.5em}}
</style>
</head>
<body>
<header class="top"><div class="in"><h1><i></i>CICLO GFV <span>Chefia</span></h1><button class="rf" id="rf" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>Atualizar</button></div></header>
<main id="app"></main>
<nav class="tabs" id="tabs" aria-label="Secções" hidden><div class="in">
<button class="tab" data-v="hoje"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>Hoje</button>
<button class="tab" data-v="equipa"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-7"/></svg>Equipa</button>
<button class="tab" data-v="ajustes"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>Ajustes</button>
</div></nav>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT" hidden></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="kb" id="kb" role="toolbar" aria-label="Teclado"><button type="button" id="kbP" aria-label="Campo anterior"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button><button type="button" id="kbN" aria-label="Campo seguinte"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button><button type="button" class="ok" id="kbOk">OK</button></div>
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
{
const M=[{k:'SERV',n:'Serviços',s:'Serv',pct:0,d:2},{k:'CONT',n:'Contratos',s:'Cont',pct:0,d:0},{k:'CONV',n:'Conversão',s:'Conv',pct:1,d:1},{k:'FID',n:'Fidelização',s:'Fid',pct:1,d:1},{k:'BUND',n:'Bundles',s:'Bund',pct:0,d:0}];
const SUMS={CONT:1,BUND:1};
const KEY='gfv-chefia-v1';
const API=String(window.CICLO_API||'').trim();
const ON=/^https?:\/\/\S+$/.test(API);
const $=s=>document.querySelector(s), app=$('#app'), sheet=$('#sheet'), scrim=$('#scrim');
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const toD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=toD(s);d.setDate(d.getDate()+n);return iso(d)};
const dShort=s=>{const d=toD(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1)};
const dLong=s=>toD(s).toLocaleDateString('pt-PT',{weekday:'long',day:'numeric',month:'long'});

const PPER=[[7,'7 dias'],[30,'30 dias'],[90,'90 dias']];let pLen=30,pAll=false;
const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const isP=(c,n)=>(c.nome||'Sem nome').toLowerCase()===n.toLowerCase();
const dlt=(v,m)=>v==null?'':(v>0?'+':v<0?'−':'±')+num(Math.abs(Math.round(v*100)/100),m,2)+(m.pct?' pp':'');
const arrow=v=>v>0?'▲':v<0?'▼':'=';
function overlaps(c,mine){return mine.some(x=>x.data===c.data&&(!x.ini||!c.ini||Math.abs(toMin(x.ini)-toMin(c.ini))<120))}
function spark(days,list,m){const pts=days.map(d=>{const v=list.filter(c=>c.data===d).map(c=>c.v[m.k]).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null});
 const vals=pts.filter(v=>v!=null);if(vals.length<2)return '';const ob=((metas()[m.k]||[])[1]);let lo=Math.min(...vals),hi=Math.max(...vals);if(ob!=null){lo=Math.min(lo,ob);hi=Math.max(hi,ob)}if(hi===lo){hi+=1;lo-=1}
 const X=i=>pts.length<2?50:i/(pts.length-1)*100,Y=v=>26-(v-lo)/(hi-lo)*24;
 const line=pts.map((v,i)=>v==null?null:X(i).toFixed(2)+','+Y(v).toFixed(2)).filter(Boolean).join(' ');
 return `<svg class="spark" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true">${ob!=null?`<line x1="0" x2="100" y1="${Y(ob)}" y2="${Y(ob)}" class="ob"/>`:''}<polyline points="${line}"/></svg>`}
function personSheet(n,a0,b0,from){
 if(sheet.hidden)pAll=false;
 const t=todayISO(),a=addD(t,-(pLen-1)),pa=addD(t,-(2*pLen-1)),pb=addD(t,-pLen);
 const all=(D&&D.ciclos)||[];
 const mine=all.filter(c=>isP(c,n)&&c.data>=a&&c.data<=t).sort(byTime),prev=all.filter(c=>isP(c,n)&&c.data>=pa&&c.data<=pb);
 const others=all.filter(c=>!isP(c,n)&&c.data>=a&&c.data<=t);
 const R=agg(mine),P=agg(prev),T=agg(others),e=evalRows(R);
 const days=[...new Set(mine.map(c=>c.data))].sort();
 const ind=R.map((r,i)=>{const pv=P[i].avg,tv=T[i].avg;return {r,dPrev:r.avg!=null&&pv!=null?r.avg-pv:null,dTeam:r.avg!=null&&tv!=null?r.avg-tv:null,rel:r.avg!=null&&tv?(r.avg-tv)/tv:null,relPrev:r.avg!=null&&pv?(r.avg-pv)/pv:null}});
 const ranked=ind.filter(x=>x.rel!=null).sort((x,y)=>y.rel-x.rel);
 const best=ranked.filter(x=>x.rel>0.02).slice(0,3),worst=ranked.filter(x=>x.rel<-0.02).slice(-3).reverse();
 const up=ind.filter(x=>x.relPrev!=null&&x.relPrev>0.02).sort((x,y)=>y.relPrev-x.relPrev),down=ind.filter(x=>x.relPrev!=null&&x.relPrev<-0.02).sort((x,y)=>x.relPrev-y.relPrev);
 const withP=others.filter(c=>overlaps(c,mine)),without=others.filter(c=>!overlaps(c,mine)),W=agg(withP),WO=agg(without);
 const eff=M.map((m,i)=>({m,w:W[i],wo:WO[i]})).filter(x=>x.w.n>=3&&x.wo.n>=3&&x.w.avg!=null&&x.wo.avg!=null).map(x=>({...x,d:x.w.avg-x.wo.avg,rel:x.wo.avg?(x.w.avg-x.wo.avg)/x.wo.avg:0})).sort((x,y)=>y.rel-x.rel);
 const slots={};mine.filter(c=>c.ini).forEach(c=>{const h=Math.floor(toMin(c.ini)/120)*2;(slots[h]=slots[h]||[]).push(c)});
 const sl=Object.entries(slots).filter(([,cs])=>cs.length>=2).map(([h,cs])=>{let hit=0,tot=0;cs.forEach(c=>{const q=cycEval(c);hit+=q.hit;tot+=q.tot});return {h:+h,n:cs.length,r:tot?hit/tot:null}}).filter(x=>x.r!=null).sort((x,y)=>y.r-x.r);
 const li=(x,txt)=>`<li><b>${x.r?x.r.m.n:x.m.n}</b> ${txt}</li>`;
 const recent=pAll?[...days].reverse():[...days].reverse().slice(0,10);
 sheet.innerHTML=`<div class="grab" id="grab"><div class="bar"></div><div class="hd"><h2 id="shT">${esc(n)}</h2><p>Últimos ${pLen} dias · ${plural(mine.length,'ciclo','ciclos')}${e.tot?' · '+e.hit+' de '+e.tot+' objetivos na média':''}</p></div></div>
 <div class="sbody"><div class="seg s3" role="radiogroup" aria-label="Período"><i style="transform:translateX(${PPER.findIndex(p=>p[0]===pLen)*100}%)"></i>${PPER.map(([k,tx])=>`<button role="radio" data-l="${k}" aria-checked="${k===pLen}">${tx}</button>`).join('')}</div>`
 +(!mine.length?`<p class="empty">Sem ciclos nos últimos ${pLen} dias.</p>`:
 `<div class="ins">${best.length||worst.length?`<div class="box g"><h4>Melhor em</h4><ul>${best.map(x=>li(x,`${dlt(x.dTeam,x.r.m)} que a equipa`)).join('')||'<li>Nada acima da média da equipa</li>'}</ul></div><div class="box r"><h4>Pior em</h4><ul>${worst.map(x=>li(x,`${dlt(x.dTeam,x.r.m)} que a equipa`)).join('')||'<li>Nada abaixo da média da equipa</li>'}</ul></div>`:''}
 ${P.some(x=>x.n)?`<div class="box"><h4>Subidas e descidas <small>vs ${pLen} dias anteriores</small></h4><ul>${up.map(x=>li(x,`<span class="tg">▲ ${dlt(x.dPrev,x.r.m)}</span>`)).join('')}${down.map(x=>li(x,`<span class="tr">▼ ${dlt(x.dPrev,x.r.m)}</span>`)).join('')}${!up.length&&!down.length?'<li>Tudo estável</li>':''}</ul></div>`:''}
 ${sl.length>=2?`<div class="box"><h4>Horário</h4><ul><li>Rende mais no ciclo das <b>${sl[0].h}h–${sl[0].h+2}h</b> (${Math.round(sl[0].r*100)}% dos objetivos)</li><li>Rende menos no das <b>${sl[sl.length-1].h}h–${sl[sl.length-1].h+2}h</b> (${Math.round(sl[sl.length-1].r*100)}%)</li></ul></div>`:''}
 <div class="box"><h4>A equipa quando está a trabalhar <small>ciclos dos colegas à mesma hora</small></h4>${eff.length?`<ul>${eff.map(x=>`<li><b>${x.m.n}</b> ${fmt(x.w.avg,x.m)} com · ${fmt(x.wo.avg,x.m)} sem <span class="${x.d>0?'tg':x.d<0?'tr':''}">${arrow(x.d)} ${dlt(x.d,x.m)}</span></li>`).join('')}</ul><p class="note" style="margin:6px 0 0">Mostra o que coincide, não prova a causa: o movimento da loja também conta.</p>`:'<p class="note" style="margin:0">Ainda há poucos ciclos dos colegas para comparar (mínimo 3 com e 3 sem).</p>'}</div></div>
 <h3 class="sec" style="margin-left:0">Indicadores · média por ciclo</h3>`
 +ind.map(x=>`<div class="irow"><div><b>${x.r.m.n}</b><small>${x.dPrev!=null?`<span class="${x.dPrev>0?'tg':x.dPrev<0?'tr':''}">${arrow(x.dPrev)} ${dlt(x.dPrev,x.r.m)}</span> vs antes`:'sem período anterior'}${x.dTeam!=null?' · '+dlt(x.dTeam,x.r.m)+' vs equipa':''}</small></div><span class="v ${cls(x.r.s)}">${fmt(x.r.avg,x.r.m)}</span>${spark(days,mine,x.r.m)}</div>`).join('')

let opener=null;
function openSheet(from){
 opener=from||null;dragSheet($('#grab'));
 sheet.hidden=false;sheet.style.transition='';sheet.style.transform='';scrim.style.transition='';scrim.style.opacity='';
 sheet.getBoundingClientRect();sheet.classList.add('open');scrim.classList.add('on');scrim.style.opacity='1';
 sheet.setAttribute('tabindex','-1');sheet.focus({preventScroll:true});document.body.style.overflow='hidden'}
function closeSheet(){
 if(sheet.hidden)return;sheet.style.transition='';sheet.style.transform='';scrim.style.transition='';
 sheet.classList.remove('open');scrim.classList.remove('on');scrim.style.opacity='0';document.body.style.overflow='';
 const done=()=>{if(!sheet.classList.contains('open')){sheet.hidden=true;sheet.innerHTML=''}};sheet.addEventListener('transitionend',done,{once:true});setTimeout(done,600);
 if(opener&&opener.isConnected)opener.focus({preventScroll:true});opener=null}
function dragSheet(h){
 let y0=0,dy=0,drag=false,hist=[];
 h.addEventListener('pointerdown',e=>{if(drag||e.button>0)return;drag=true;y0=e.clientY;dy=0;hist=[[performance.now(),0]];h.setPointerCapture(e.pointerId);sheet.style.transition='none';scrim.style.transition='none'});
 h.addEventListener('pointermove',e=>{if(!drag)return;let d=e.clientY-y0;if(d<0)d=-(Math.abs(d)*40)/(40+Math.abs(d)*.55);dy=d;sheet.style.transform=`translateY(${dy}px)`;const H=sheet.offsetHeight||1;scrim.style.opacity=String(Math.max(0,1-Math.max(0,dy)/H));hist.push([performance.now(),dy]);if(hist.length>5)hist.shift()});
 const end=()=>{if(!drag)return;drag=false;const a=hist[0],b=hist[hist.length-1];const v=b&&a&&b[0]>a[0]?(b[1]-a[1])/(b[0]-a[0]):0;const H=sheet.offsetHeight||1;sheet.style.transition='';scrim.style.transition='';if(dy>H*.4||(v>.11&&dy>10))closeSheet();else{sheet.style.transform='';scrim.style.opacity='1'}};
 h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end)}
function twoTap(el,armedTxt,done){const txt=el.textContent;let t=0;el.onclick=()=>{if(!el.classList.contains('armed')){el.classList.add('armed');el.textContent=armedTxt;t=setTimeout(()=>{el.classList.remove('armed');el.textContent=txt},4000);return}clearTimeout(t);done()}}
function holdBtn(el,ms,done){let t=null;
 const start=e=>{if(t||el.disabled)return;if(e.type==='keydown'&&e.key!=='Enter'&&e.key!==' ')return;if(e.type==='keydown')e.preventDefault();el.classList.add('holding');t=setTimeout(()=>{t=null;el.classList.remove('holding');done()},ms)};
 const stop=()=>{if(!t)return;clearTimeout(t);t=null;el.classList.remove('holding')};
 el.addEventListener('pointerdown',start);['pointerup','pointerleave','pointercancel'].forEach(x=>el.addEventListener(x,stop));el.addEventListener('keydown',start);el.addEventListener('keyup',stop);el.addEventListener('contextmenu',e=>e.preventDefault())}
scrim.onclick=()=>closeSheet();
/* teclado do iPhone: campo ativo sempre à vista e barra com ‹ › e OK */
const vv=window.visualViewport,kb=$('#kb'),COARSE=matchMedia('(pointer: coarse)').matches;
const isField=el=>el&&el.matches&&el.matches('input:not([type=checkbox]):not([type=radio]):not([type=date]):not([type=time]),textarea');
const fieldList=()=>[...(sheet.hidden?app:sheet).querySelectorAll('input:not([type=checkbox]):not([type=radio]):not([type=date]):not([type=time]),textarea')].filter(e=>e.offsetParent);
function fit(){
 const h=vv?vv.height:innerHeight,top=vv?vv.offsetTop:0,kbOpen=COARSE&&isField(document.activeElement);
 kb.classList.toggle('on',kbOpen);const kh=kbOpen?kb.offsetHeight:0;
 if(kbOpen){kb.style.top=(top+h-kh)+'px';const L=fieldList(),i=L.indexOf(document.activeElement);$('#kbP').disabled=i<=0;$('#kbN').disabled=i<0||i>=L.length-1}
 document.documentElement.style.setProperty('--vvh',(h-kh)+'px');
 sheet.style.bottom=Math.max(0,innerHeight-h-top+kh)+'px'}
function reveal(el){if(!el||!el.isConnected)return;const box=el.closest('.sbody');const h=vv?vv.height:innerHeight,top=vv?vv.offsetTop:0,kh=kb.classList.contains('on')?kb.offsetHeight:0;const r=el.getBoundingClientRect();
 if(box){const b=box.getBoundingClientRect(),lo=Math.min(b.bottom,top+h-kh)-16,hi=b.top+8;if(r.bottom>lo)box.scrollTop+=r.bottom-lo;else if(r.top<hi)box.scrollTop-=hi-r.top}
 else{const lo=top+h-kh-24;if(r.bottom>lo||r.top<top+80)window.scrollBy(0,r.top-(top+h/3))}}
document.addEventListener('focusin',e=>{if(!isField(e.target))return;fit();setTimeout(()=>{fit();reveal(e.target)},320)});
document.addEventListener('focusout',()=>setTimeout(fit,60));
if(vv){vv.addEventListener('resize',()=>{fit();if(isField(document.activeElement))reveal(document.activeElement)});vv.addEventListener('scroll',fit)}
kb.addEventListener('pointerdown',e=>e.preventDefault());
const step=d=>{const L=fieldList(),i=L.indexOf(document.activeElement);const nx=L[i+d];if(nx){nx.focus({preventScroll:true});reveal(nx)}};
$('#kbP').onclick=()=>step(-1);$('#kbN').onclick=()=>step(1);$('#kbOk').onclick=()=>{document.activeElement&&document.activeElement.blur();fit()};
fit();

async function share(name,blob){
 try{const f=new File([blob],name,{type:blob.type||'application/octet-stream'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
